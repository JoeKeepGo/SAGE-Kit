name: SAGE-Kit repository integrity

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: sagekit-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    runs-on: ubuntu-latest
    env:
      SAGEKIT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check static repository integrity
        run: bash scripts/check-repository.sh
      - name: Check Claude Code hooks
        run: bash tests/test_claude_hooks.sh

  windows:
    runs-on: windows-latest
    env:
      SAGEKIT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check static repository integrity
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Check Claude Code hooks
        shell: pwsh
        run: ./tests/test_claude_hooks.ps1
