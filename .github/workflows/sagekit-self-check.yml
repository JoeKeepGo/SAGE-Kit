name: SAGE-Kit repository integrity

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: sagekit-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check optional continuation and RSI adapters
        run: node --test tests/continuation.test.mjs tests/rsi*.test.mjs tests/agent-host.test.mjs tests/project-mapping.test.mjs

  dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tested host into an isolated test directory
        run: npm install --prefix "$RUNNER_TEMP/sage-dsh-host" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - name: Pack and install the optional artifact without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/sage-dsh-pack"
          npm pack ./adapters --ignore-scripts --pack-destination "$RUNNER_TEMP/sage-dsh-pack" --json > "$RUNNER_TEMP/sage-dsh-pack/manifest.json"
          artifact_name=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1]))[0].filename' "$RUNNER_TEMP/sage-dsh-pack/manifest.json")
          artifact_path="$RUNNER_TEMP/sage-dsh-pack/$artifact_name"
          npm install --prefix "$RUNNER_TEMP/sage-dsh-installed" --ignore-scripts --legacy-peer-deps --offline --no-audit --no-fund "$artifact_path"
          ln -s "$RUNNER_TEMP/sage-dsh-host/node_modules/@deepseek-ai" "$RUNNER_TEMP/sage-dsh-installed/node_modules/@deepseek-ai"
          echo "SAGE_DSH_TARBALL=$artifact_path" >> "$GITHUB_ENV"
      - name: Check native DSH integration and recovery
        env:
          SAGE_DSH_NODE_MODULES: ${{ runner.temp }}/sage-dsh-host/node_modules
          SAGE_DSH_PLUGIN_PATH: ${{ runner.temp }}/sage-dsh-installed/node_modules/@sage-kit/dsh-plugin/dsh.mjs
        run: node --test tests/dsh*.test.mjs

  posix:
    runs-on: ubuntu-latest
    env:
      SAGEKIT_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref_type == 'branch' && github.event.before || '' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag is reachable from main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$(git rev-list -n 1 "$GITHUB_REF")" origin/main
      - name: Check static repository integrity
        run: bash scripts/check-repository.sh
      - name: Check portable Skill references
        run: bash tests/test_skill_portable_references.sh
      - name: Check Claude Code hooks
        run: bash tests/test_claude_hooks.sh

  windows:
    runs-on: windows-latest
    env:
      SAGEKIT_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref_type == 'branch' && github.event.before || '' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag is reachable from main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $tagTarget = git rev-list -n 1 $env:GITHUB_REF
          git merge-base --is-ancestor $tagTarget origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release tag target is not reachable from main' }
      - name: Check static repository integrity
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Check portable Skill references
        run: bash tests/test_skill_portable_references.sh
      - name: Check Claude Code hooks
        shell: pwsh
        run: ./tests/test_claude_hooks.ps1

  macos:
    runs-on: macos-latest
    env:
      SAGEKIT_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref_type == 'branch' && github.event.before || '' }}
      SAGEKIT_JSON_PARSER: plutil
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag is reachable from main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$(git rev-list -n 1 "$GITHUB_REF")" origin/main
      - name: Check static repository integrity with stock macOS tools
        run: bash scripts/check-repository.sh
      - name: Check portable Skill references
        shell: pwsh
        run: ./tests/test_skill_portable_references.ps1
