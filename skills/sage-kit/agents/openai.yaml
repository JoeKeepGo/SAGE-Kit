interface:
  display_name: "SAGE-Kit"
  short_description: "Model-native SPEC, execution, and review governance"
  default_prompt: >-
    Use $sage-kit only when explicitly requested or selected by current project
    authority. Apply the project's active SPEC, permission and human-gate
    boundaries. Use native model brainstorming, planning, test-driven
    implementation, debugging, subagent orchestration, review, verification,
    and branch completion without loading an additional composite workflow.
    Descendants inherit the same restriction and all project boundaries.

policy:
  allow_implicit_invocation: false
